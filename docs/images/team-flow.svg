<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc"><title id="title">独立 AI 团队：从目标到验收</title><desc id="desc">经理与员工各有固定 Codex 会话；关键回报回到原经理会话处理。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f5ff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><linearGradient id="accent"><stop stop-color="#586bdd"/><stop offset="1" stop-color="#8b68cb"/></linearGradient></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:22px;font-weight:650;fill:#272943}.sub{font-size:14px;fill:#6c718a}.label{font-size:18px;font-weight:600;fill:#2e324b}.note{font-size:14px;fill:#72788f}.num{font-size:15px;font-weight:650;fill:white}.line{fill:none;stroke:#a8add5;stroke-width:2.5}.small{font-size:12px;fill:#787e96}</style><rect width="1100" height="380" rx="20" fill="url(#bg)"/><text x="32" y="41" class="title">独立 AI 团队：从目标到验收</text><text x="32" y="66" class="sub">经理与员工各有固定 Codex 会话；关键回报回到原经理会话处理。</text><path d="M 342 139 H 410 M 682 139 H 750 M 1022 139 C 1062 139 1062 281 1022 281 M 750 281 H 682 M 410 281 H 342" class="line"/><rect x="70" y="93" width="272" height="92" rx="15" fill="#fff" stroke="#dce0f1"/><circle cx="99" cy="122" r="14" fill="url(#accent)"/><text x="99" y="127" text-anchor="middle" class="num">1</text><text x="123" y="128" class="label">你交代目标</text><text x="92" y="158" class="note">送到经理的固定会话</text><rect x="410" y="93" width="272" height="92" rx="15" fill="#fff" stroke="#dce0f1"/><circle cx="439" cy="122" r="14" fill="url(#accent)"/><text x="439" y="127" text-anchor="middle" class="num">2</text><text x="463" y="128" class="label">经理真实派单</text><text x="432" y="158" class="note">进入对应员工的固定会话</text><rect x="750" y="93" width="272" height="92" rx="15" fill="#fff" stroke="#dce0f1"/><circle cx="779" cy="122" r="14" fill="url(#accent)"/><text x="779" y="127" text-anchor="middle" class="num">3</text><text x="803" y="128" class="label">员工实际执行</text><text x="772" y="158" class="note">在工作文件夹执行并留下记录</text><rect x="750" y="235" width="272" height="92" rx="15" fill="#fff" stroke="#dce0f1"/><circle cx="779" cy="264" r="14" fill="url(#accent)"/><text x="779" y="269" text-anchor="middle" class="num">4</text><text x="803" y="270" class="label">员工交付与回报</text><text x="772" y="300" class="note">核验文件后进入经理收件箱</text><rect x="410" y="235" width="272" height="92" rx="15" fill="#f1faf6" stroke="#b8d8c8"/><circle cx="439" cy="264" r="14" fill="url(#accent)"/><text x="439" y="269" text-anchor="middle" class="num">5</text><text x="463" y="270" class="label">经理读取并核验</text><text x="432" y="300" class="note">实际检查文件，验收或要求修正</text><rect x="70" y="235" width="272" height="92" rx="15" fill="#f1faf6" stroke="#b8d8c8"/><circle cx="99" cy="264" r="14" fill="url(#accent)"/><text x="99" y="269" text-anchor="middle" class="num">6</text><text x="123" y="270" class="label">结果回到你面前</text><text x="92" y="300" class="note">经理对话、任务和协作页同步</text><text x="70" y="360" class="small">已提交、已开工、已交付、已验收分别记录；完成、阻碍和需决定事件触发经理处理。</text></svg>
